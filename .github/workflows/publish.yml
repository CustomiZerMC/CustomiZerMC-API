name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          server-id: oreostudios-customizer
          server-username: REPOSILITE_USERNAME
          server-password: REPOSILITE_PASSWORD
      - name: Deploy to maven.oreostudios.fr/customizer
        run: mvn -B deploy -DskipTests
        env:
          REPOSILITE_USERNAME: ${{ secrets.REPOSILITE_USERNAME }}
          REPOSILITE_PASSWORD: ${{ secrets.REPOSILITE_PASSWORD }}
